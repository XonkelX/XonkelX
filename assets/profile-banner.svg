<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Oniel Alejo Feliz — Full-Stack Developer</title>
  <desc id="desc">Profile banner for a full-stack developer building dependable and accessible web products in Tampa, Florida.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14532D"/><stop offset="0.55" stop-color="#0B4A38"/><stop offset="1" stop-color="#052E24"/>
    </linearGradient>
    <linearGradient id="line" x1="230" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0"/><stop offset="0.5" stop-color="#A7F3D0"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
